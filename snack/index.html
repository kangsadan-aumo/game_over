<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-wrapper">
        <div class="phone-frame">
            <div class="phone-speaker">
                <div></div><div></div><div></div>
            </div>
            
            <div class="screen-bezel">
                <div class="screen-container">
                    <canvas id="gameCanvas" width="260" height="180"></canvas>
                    <div class="screen-hud">
                        <div class="hud-line"></div>
                        <div class="hud-content">
                            <span id="score-display">0000</span>
                            <div class="progress-bar">
                                <div class="progress-fill" id="progress-fill"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="game-over" id="gameOverScreen">
                        <h2>GAME OVER</h2>
                        <button id="restartBtn">RETRY</button>
                    </div>
                    <div class="start-screen" id="startScreen">
                        <div class="mode-select">
                            <label class="mode-label">
                                <input type="radio" name="gameMode" value="box" checked>
                                <span class="radio-custom"></span> Box (Walls)
                            </label>
                            <label class="mode-label">
                                <input type="radio" name="gameMode" value="wrap">
                                <span class="radio-custom"></span> No Borders
                            </label>
                            <label class="mode-label">
                                <input type="radio" name="gameMode" value="obstacles">
                                <span class="radio-custom"></span> Obstacles
                            </label>
                        </div>
                        <p class="blink">Press arrow to start</p>
                    </div>
                </div>
            </div>
            
            <div class="keypad-area">
                <div class="top-row">
                    <button class="soft-key"><div class="blue-line"></div></button>
                    
                    <div class="d-pad-container">
                        <button class="d-pad-btn up" id="btn-up"></button>
                        <button class="d-pad-btn left" id="btn-left"></button>
                        <button class="d-pad-btn right" id="btn-right"></button>
                        <button class="d-pad-btn down" id="btn-down"></button>
                        <div class="d-pad-center"></div>
                    </div>
                    
                    <button class="soft-key"><div class="blue-line"></div></button>
                </div>
                
                <div class="call-row">
                    <button class="call-btn"><div class="icon green-phone">☎</div></button>
                    <button class="call-btn"><div class="icon red-phone">☎</div></button>
                </div>
                
                <div class="numpad">
                    <button class="num-btn">1 <span class="sub">oo</span></button>
                    <button class="num-btn">2 <span class="sub">abc</span></button>
                    <button class="num-btn">3 <span class="sub">def</span></button>
                    <button class="num-btn">4 <span class="sub">ghi</span></button>
                    <button class="num-btn">5 <span class="sub">jkl</span></button>
                    <button class="num-btn">6 <span class="sub">mno</span></button>
                    <button class="num-btn">7 <span class="sub">pqrs</span></button>
                    <button class="num-btn">8 <span class="sub">tuv</span></button>
                    <button class="num-btn">9 <span class="sub">wxyz</span></button>
                    <button class="num-btn">* <span class="sub">+</span></button>
                    <button class="num-btn">0 <span class="sub">_</span></button>
                    <button class="num-btn"># <span class="sub">⇧</span></button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
